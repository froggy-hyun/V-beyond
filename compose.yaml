name: product-lens
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: productlens
      POSTGRES_USER: productlens
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - catalog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "productlens", "-d", "productlens"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    image: ${BACKEND_IMAGE:-product-lens-backend:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/productlens
      SPRING_DATASOURCE_USERNAME: productlens
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-disabled}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:-REPLAY}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 30s
  frontend:
    image: ${FRONTEND_IMAGE:-product-lens-frontend:local}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-18081}:8080"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
volumes:
  catalog:
