limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ai:10m rate=5r/m;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 4k;
    limit_req_status 429;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $api "http://backend:8080";

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    root /usr/share/nginx/html;

    location = /api/v1/ai/discover {
        limit_req zone=ai burst=8 nodelay;
        proxy_pass $api;
    }
    location = /api/v1/market/stream {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 140s;
        limit_req zone=api burst=35 nodelay;
        proxy_pass $api;
    }
    location /api/ {
        limit_req zone=api burst=35 nodelay;
        proxy_pass $api;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
