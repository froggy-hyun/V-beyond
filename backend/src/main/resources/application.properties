spring.application.name=product-lens
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/productlens}
spring.datasource.username=${DB_USERNAME:productlens}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.ai.openai.api-key=${OPENAI_API_KEY:disabled}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.model.embedding=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.retry.max-attempts=1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
spring.mvc.async.request-timeout=120000
spring.http.client.connect-timeout=4s
spring.http.client.read-timeout=10s
